# @package _global_

defaults:
  - override /data: ba_small.yaml #add a file to mix datasets? (e.g rb_large + ba_large + ...)
  - override /model: gcon.yaml
  - override /task: multitask.yaml
  - override /callbacks: default.yaml
  - override /trainer: gpu.yaml
  - override /logger: wandb.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters


tags: ["multitask", "ba", "small", "gcon"]

seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 200
  gradient_clip_val: 0.5
  check_val_every_n_epoch: 5

callbacks:
  model_checkpoint:
    monitor: "val/loss"
    mode: "min"
  early_stopping:
    monitor: "val/loss"
    mode: "min"

logger:
  wandb:
    tags: ${tags}

#data:
#  num_workers : 0

model:
  _target_: src.models.copt_module.MultiCOPTModule
  ### define custom weights for the losses ###
  weights:
    maxcut: 1
    maxclique: 1
    mds: 1
    mis: 1
    color: 1
    cliquecover: 1
  strategy: 'alternate' #sum OR alternate OR pcgrad
  net:
    _target_: src.models.network.gnn.MultiHybridGNN
    dim_out:
      maxcut: 1
      maxclique: 1
      mds: 1
      mis: 1
      ### change for the number of colors/cliques desired ###
      color: 10
      cliquecover: 10
    dim_inner: 64
    # write here the list of tasks to train on 
    tasks : ['maxcut'] 
    layers_pre_mp: 1
    layers_mp: 16
    layers_post_mp: 1
    stage_type: 'stack'
    batch_norm: True
    l2_norm: False
    final_l2_norm: False
    dropout: 0.3
    has_act: True
    act:
      _target_: torch.nn.LeakyReLU
      negative_slope: 0.3
    # temporary fix for eccentricity (doesn't work with rb dataset)
    encoder:
      dim_hid: 64
      node_encoder:
        dim_pe: 64
        dim_emb: 64
        stat_list: ['degree', 'cluster_coefficient', 'triangle_count']
      node_encoder_bn: True
    finetuning:
      strategy :  #'linear_probing' or 'finetuning' or 'pre_post' (only freezes mp) or 'poly' or None
      new_tasks: ['mis']
      path: ${paths.checkpoint_dir}/maxcut/last.ckpt 
    conv:
      _target_: src.models.layer.gconconv.GCONLayer
      dim_in: 64
      dim_out: 64
      channel_list: [[0], [1], [2], [4], [0, 1], [1, 2], [2, 4]]
      combine_fn: 'att_bias'
      num_heads: 1
      activation_att1: 'elu'
      activation_att2: 'elu'
      activation: 'elu'
      depth_mlp: 1
      skip: True
      add_self_loops: True
      norm: 'gcn'
      filter_norm_dim: None
      bias: False

  